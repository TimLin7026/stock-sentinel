name: Market Daily Data & Health Sync

on:
  schedule:
    # 台灣時間週一至週五 21:15 (UTC 13:15) 自動執行
    - cron: '15 13 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定補抓日期 (格式: YYYYMMDD，留空則預設最近1個開市日)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出專案代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝必要依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 🚀 執行雲端行情大腦與指標審計
        run: |
          python scripts/market_worker.py "${{ github.event.inputs.target_date }}"

      - name: 💾 自動提交並推播快照與健康報表至 GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update market snapshot and health audit [skip ci]"
          file_pattern: "market_snapshot.json.gz market_health.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
