name: Market Daily Data & Health Sync

on:
  # 已全面改由 Google Apps Script (GAS) 透過 REST API 秒級定時觸發 (14:40 / 16:30 / 20:30)，徹底消除 GitHub cron 排隊延遲
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定補抓日期 (格式: YYYYMMDD，留空則自動探測)'
        required: false
        default: ''
      scan_days:
        description: '深度掃描最近 N 個開市日 (例如: 120，留空或0為一般模式)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出專案代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝必要依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 🚀 執行雲端行情大腦與指標審計
        run: |
          python scripts/market_worker.py --target-date="${{ github.event.inputs.target_date }}" --scan-days="${{ github.event.inputs.scan_days }}"

      - name: 💾 自動提交並防撞推播至 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_snapshot.json.gz market_history_60d.json.gz market_health.json scripts/market_history.db
          if git diff --staged --quiet; then
            echo "☕ 行情快照無變更，無需提交。"
            exit 0
          fi
          git commit -m "chore(data): auto-update market snapshot, 60d history, db and health audit [skip ci]"
          for i in {1..5}; do
            echo "🚀 嘗試推播至遠端 (第 $i 次)..."
            if git push origin main; then
              echo "✅ 行情快照推播成功！"
              exit 0
            else
              echo "⚠️ 偵測到遠端有新提交，正在拉取最新 commit 並自動 rebase..."
              git pull --rebase origin main
              sleep 2
            fi
          done
          echo "❌ 推播重試 5 次後仍失敗"
          exit 1
